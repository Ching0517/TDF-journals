<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#444"/></marker></defs><rect width="1060" height="600" fill="white"/><text x="530.0" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">The Last Leaf  -  system diagram (what talks to what)</text><text x="85" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#777">PERSON</text><text x="250" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#777">INPUT</text><text x="470" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#777">PROCESSING</text><text x="820" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#777">OUTPUT</text><rect x="25" y="250" width="120" height="90" rx="10" fill="#F3F0FA" stroke="#6A5ACD" stroke-width="1.5"/><text x="85" y="285" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">Visitor</text><text x="85" y="307" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">hand + body</text><rect x="190" y="110" width="130" height="80" rx="10" fill="#E9F7EE" stroke="#2B9348" stroke-width="1.5"/><text x="255" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Ultrasonic</text><text x="255" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">HC-SR04</text><text x="255" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="mi