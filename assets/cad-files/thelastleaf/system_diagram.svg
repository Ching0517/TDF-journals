="1.8" marker-end="url(#ah)"/><polyline points="505,383 505,212" fill="none" stroke="#1D6FD1" stroke-width="1.8" marker-end="url(#ah)"/><text x="438" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#1D6FD1">NEAR</text><text x="438" y="296" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end" fill="#1D6FD1">(sensor drop)</text><text x="512" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1D6FD1">D, P0-100,</text><text x="512" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1D6FD1">C, I</text><text x="512" y="312" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1D6FD1">USB serial, 115200 baud</text><text x="512" y="327" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#1D6FD1">(Web Serial in Chrome)</text><rect x="620" y="105" width="120" height="90" rx="10" fill="#FFF4E0" stroke="#E07A00" stroke-width="1.5"/><text x="680" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Servo</text><text x="680" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">MG90S 180 deg</text><rect x="770" y="105" width="130" height="90" rx="10" fill="#FFF4E0" stroke="#E07A00" stroke-width="1.5"/><text x="835" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Sector gear</text><text x="835" y="152" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">+ 14T pinion (1:4)</text><text x="835" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="m