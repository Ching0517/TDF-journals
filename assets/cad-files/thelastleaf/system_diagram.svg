ear</text><polyline points="145,310 170,310 170,440 188,440" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/><text x="176" y="385" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#333">paints in the air</text><polyline points="320,150 378,150" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="320,440 383,440" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/><polyline points="985,195 985,560 85,560 85,342" fill="none" stroke="#6A5ACD" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="6 4"/><polyline points="710,490 710,560" fill="none" stroke="#6A5ACD" stroke-width="1.6" stroke-dasharray="6 4"/><text x="540" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#6A5ACD">feedback: the visitor sees the leaf fall, paints it on screen, and watches the real leaf rise again</text></svg>