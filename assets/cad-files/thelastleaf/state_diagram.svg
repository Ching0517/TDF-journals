<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#444"/></marker></defs><rect width="1080" height="500" fill="white"/><text x="540.0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">The Last Leaf  -  state diagram (what happens over time)</text><text x="80" y="205.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Physical</text><text x="80" y="223.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">(Arduino)</text><text x="80" y="345.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Screen</text><text x="80" y="363.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">(p5.js)</text><rect x="160" y="86" width="150" height="44" rx="10" fill="#E9F7EE" stroke="#2B9348" stroke-width="1.5"/><text x="235.0" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">IDLE</text><rect x="160" y="150" width="150" height="118" rx="8" fill="white" stroke="#2B9348" stroke-width="1.5"/><text x="235.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">servo breathes</text><text x="235.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">+/-16 deg</text><text x="235.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">sensor ON</text><rect x="160" y="290" width="150" height="118" rx="8" fill="white" stroke="#2B9348" stroke-width="1.5"/><text x="235.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">bare tree</text><text x="235.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">leaves drifting</text><text x="235.0" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">saved leaves on</text><text x="235.0" y="364" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">branches</text><polyline points="310,108.0 338,108.0" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/><text x="325.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">hand ≤ 5 cm for 1 s</text><rect x="340" y="86" width="150" height="44" rx="10" fill="#FCEBEB" stroke="#C0392B" stroke-width="1.5"/><text x="415.0" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">DROP</text><rect x="340" y="150" width="150" height="118" rx="8" fill="white" stroke="#C0392B" stroke-width="1.5"/><text x="415.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">servo jumps to gap</text><text x="415.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">(0 or 180 deg)</text><text x="415.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">spool free: leaf falls</text><text x="415.0" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">sends NEAR to p5</text><rect x="340" y="290" width="150" height="118" rx="8" fill="white" stroke="#C0392B" stroke-width="1.5"/><text x="415.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">all leaves fall</text><text x="415.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">(SPACE = test)</text><polyline points="490,108.0 518,108.0" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/><text x="505.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">leaves gone (~3 s)</text><rect x="520" y="86" width="150" height="44" rx="10" fill="#EEEEEE" stroke="#666" stroke-width="1.5"/><text x="595.0" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">WAIT</text><rect x="520" y="150" width="150" height="118" rx="8" fill="white" stroke="#666" stroke-width="1.5"/><text x="595.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">leaf lies on</text><text x="595.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">the ground</text><text x="595.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">waits for P</text><rect x="520" y="290" width="150" height="118" rx="8" fill="white" stroke="#666" stroke-width="1.5"/><text x="595.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">screen darkens</text><text x="595.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">silence</text><text x="595.0" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">leaf outline fades in</text><polyline points="670,108.0 698,108.0" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/><text x="685.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">sketch shown (~2.6 s)</text><rect x="700" y="86" width="150" height="44" rx="10" fill="#FFF4E0" stroke="#E07A00" stroke-width="1.5"/><text x="775.0" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">PAINT</text><rect x="700" y="150" width="150" height="118" rx="8" fill="white" stroke="#E07A00" stroke-width="1.5"/><text x="775.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">P0..P100 sets angle</text><text x="775.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">winds leaf up from</text><text x="775.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">the other side</text><text x="775.0" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">(15 deg/s max)</text><rect x="700" y="290" width="150" height="118" rx="8" fill="white" stroke="#E07A00" stroke-width="1.5"/><text x="775.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">ml5 hand tracking</text><text x="775.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">paint inside the leaf</text><text x="775.0" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">coverage % → P</text><polyline points="850,108.0 878,108.0" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/><text x="865.0" y="74" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#444">painted 100 %</text><rect x="880" y="86" width="150" height="44" rx="10" fill="#E8F1FA" stroke="#1D6FD1" stroke-width="1.5"/><text x="955.0" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">RETURN</text><rect x="880" y="150" width="150" height="118" rx="8" fill="white" stroke="#1D6FD1" stroke-width="1.5"/><text x="955.0" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">C: finish to top</text><text x="955.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">sensor OFF</text><text x="955.0" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">until p5 sends I</text><rect x="880" y="290" width="150" height="118" rx="8" fill="white" stroke="#1D6FD1" stroke-width="1.5"/><text x="955.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">painted leaf flies</text><text x="955.0" y="332" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">onto a branch</text><text x="955.0" y="348" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#333">and stays there</text><polyline points="1030,108.0 1058,108.0 1058,448 235.0,448 235.0,412" fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#ah)"/><text x="655.0" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#444">screen back to idle → p5 sends I → sensor ON again (loop)</text><text x="540.0" y="486" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#777">Without the laptop the Arduino runs the short loop on its own: IDLE → DROP → (2 s) → lift on the other side → IDLE</text></svg>